<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abel-MD | Official</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(to right, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { opacity: 0.8; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.05rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(139, 92, 246, 0.5);
    }
    .footer {
      margin-top: 32px;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Abel-MD</h1>
    <p>Clean • Fast • Multi-Device WhatsApp Bot<br>Created by AbelSegawa439</p>
    <a href="/pair" class="btn">Get Pairing Code →</a>
    <div class="footer">© Abel-MD 2026</div>
  </div>
</body>
</html>
