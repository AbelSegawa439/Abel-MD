<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pair • Abel-MD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      background: linear-gradient(to right, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub { opacity: 0.75; margin-bottom: 24px; font-size: 0.95rem; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.25);
      color: white;
      font-size: 1.05rem;
      margin-bottom: 16px;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.4); }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      display: none;
    }
    .code {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: #a78bfa;
      margin: 12px 0;
      user-select: all;
    }
    .hint { font-size: 0.85rem; opacity: 0.7; line-height: 1.4; }
    .error { color: #f87171; margin-top: 12px; display: none; }
    a.back {
      display: inline-block;
      margin-top: 20px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Link Device</h1>
    <p class="sub">Enter your WhatsApp number with country code</p>

    <input type="text" id="number" placeholder="e.g. 256747287538" />
    <button id="btn" onclick="getCode()">Get Pair Code</button>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div>Your Pairing Code</div>
      <div class="code" id="code"></div>
      <div class="hint">
        Open WhatsApp → Linked Devices → Link a Device → Link with phone number<br>
        Then enter the code above.
      </div>
    </div>

    <a href="/" class="back">← Back</a>
  </div>

  <script>
    async function getCode() {
      const number = document.getElementById("number").value.trim();
      const btn = document.getElementById("btn");
      const errorEl = document.getElementById("error");
      const resultEl = document.getElementById("result");

      errorEl.style.display = "none";
      resultEl.style.display = "none";

      if (!number) {
        errorEl.textContent = "Please enter a valid number";
        errorEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating...";

      try {
        const res = await fetch("/api/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number })
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          throw new Error(data.error || "Failed to get code");
        }

        if (data.alreadyPaired) {
          errorEl.textContent = data.message;
          errorEl.style.display = "block";
        } else {
          document.getElementById("code").textContent = data.code;
          resultEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Get Pair Code";
      }
    }
  </script>
</body>
</html>
